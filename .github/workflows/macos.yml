name: macOS build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test and build universal app
        run: bash scripts/test-mac.sh
      - name: Package with bundled animation
        run: bash scripts/package-mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: DragonCodexBoot-mac-universal
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
